server {
	listen 80;
	listen [::]:80;
	server_name localhost;

	gzip on;
	gzip_types *;
	gzip_static on;
	gzip_proxied any;
	gzip_vary on;
	gzip_disable "MSIE [1-6]\.";

	client_max_body_size 0;

	location /x-admin-element-vue3/ {
		alias /usr/share/nginx/html/;
		index index.html;
		add_header Cache-Control no-cache;
		add_header Pragma no-cache;
		add_header Expires 0;
		if ($request_filename ~* .*\.(?:htm|html)$) {
			add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate";
		}
		try_files $uri $uri/ /x-admin-element-vue3/index.html;
	}

	error_page 404 /usr/share/nginx/html/index.html;
	error_page 500 501 502 503 504 /usr/share/nginx/html/index.html;
	location = /50x.html {
		root /usr/share/nginx/html/index.html;
	}
}
