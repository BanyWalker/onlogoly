# Foundation profile starts without a database. Activate postgres explicitly.
spring.application.name=x-yuan-ontology-api
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
spring.flyway.enabled=false
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
# 对象建模工作空间（本地 JSON 文件存储，TDD-OM-002 §10，DEV-4）
xiyuan.workspace.dir=${XIYUAN_WORKSPACE_DIR:data/workspaces/ENV-OM-001}
