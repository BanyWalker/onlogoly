# Foundation profile starts without a database. Activate postgres explicitly.
spring.application.name=x-yuan-ontology-api
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
spring.flyway.enabled=false
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
xiyuan.storage.backend=${XIYUAN_STORAGE_BACKEND:json}
xiyuan.storage.data-dir=${XIYUAN_DATA_DIR:${user.dir}/../workspace-data}
xiyuan.workspace.id=${XIYUAN_WORKSPACE_ID:ENV-OM-001}
xiyuan.workspace.dir=${XIYUAN_WORKSPACE_DIR:${xiyuan.storage.data-dir}/workspaces/${xiyuan.workspace.id}}
